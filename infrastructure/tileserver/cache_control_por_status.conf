# Cache-Control que depende do STATUS (spec 003 do alfaero-map-tiles).
#
# Sem isto, o `add_header ... always` das locations carimba TAMBEM 4xx/5xx: uma
# falha de 1 segundo do upstream sai etiquetada como cacheavel por ate 30 dias e
# o Cloudflare guarda o erro. Um 502 transitorio virava buraco fixo no mapa, no
# mesmo tile, com a origem sadia (9 casos medidos em 27/08/2026).
#
# ATENCAO: o `default` de cada map e OBRIGATORIO. add_header com valor vazio
# OMITE o header, e a resposta 200 ficaria sem Cache-Control nenhum.
# As strings de default sao copia exata do que cada location mandava antes.

map $status $cc_30d {     # satellite, satellite-labels, topo, styles|data, hybrid
    default  "public, max-age=3600, s-maxage=2592000, stale-while-revalidate=86400";
    ~^[45]   "no-store";
}

map $status $cc_7d {      # openaip
    default  "public, max-age=3600, s-maxage=604800, stale-while-revalidate=86400";
    ~^[45]   "no-store";
}

map $status $cc_owm {     # owm (layers legadas)
    default  "public, max-age=600, s-maxage=1800, stale-while-revalidate=3600";
    ~^[45]   "no-store";
}

map $status $cc_owm2 {    # owm2/weather, owm2/radar
    default  "public, max-age=300, s-maxage=900, stale-while-revalidate=1800";
    ~^[45]   "no-store";
}

map $status $cc_avwx {    # avwx (isigmet/airsigmet)
    default  "public, max-age=300, s-maxage=300, stale-while-revalidate=600";
    ~^[45]   "no-store";
}
